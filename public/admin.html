<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Vehicle Recovery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Admin Default Theme (Lime Green) */
    body.admin-app { --primary: #CCFF00; --primary-text: #000000; }
    body.admin-app[data-theme="light"] { --primary: #65A30D; --primary-text: #FFFFFF; }
  </style>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#84cc16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recovery" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
</head>
<body class="admin-app dashboard-app">
<style>
    body { background: #0a0a0a; color: #fff; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    .admin-container { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: #111; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #333; }
    .sidebar h1 { color: #84cc16; font-size: 20px; margin-top: 0; }
    .main-content { flex: 1; padding: 20px; overflow-x: auto; }
    .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .btn { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: #84cc16; color: #000; }
    .btn:hover { background: #65a30d; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 600px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #999; font-weight: normal; }
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; }
    .status-active { background: rgba(132,204,22,0.2); color: #84cc16; }
    .status-pending { background: rgba(234,179,8,0.2); color: #eab308; }
    .actions { display: flex; gap: 5px; }
    .btn-edit { background: #3b82f6; color: #fff; padding: 6px 12px; font-size: 12px; }
    .btn-delete { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; }
    .btn-approve { background: #22c55e; color: #fff; padding: 6px 12px; font-size: 12px; }
    
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #84cc16; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Tabs */
    .tab-btns { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #333; }
    .tab-btn { background: transparent; color: #999; border: none; padding: 10px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #84cc16; border-bottom: 2px solid #84cc16; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: #1a1a1a; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #333; }
    .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
</style>

<div class="admin-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <h1>🚗 VRA Portal</h1>
        <div style="margin-top: 20px;">
            <p style="color: #666; font-size: 12px; margin-bottom: 10px;">SYSTEM CONFIG</p>
            <div class="card" style="padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: bold; font-size: 14px;">Driver Wallet</div>
                    <div style="font-size: 11px; color: #999;">10% Commission</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="wallet-toggle-input" onchange="toggleWallet(this)">
                    <span class="slider"></span>
                </label>
            </div>
            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="alert('Settings page coming soon!')">⚙️ Settings</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h2 style="margin-top: 0;">System Management</h2>
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="tab-btns">
                    <button class="tab-btn active" onclick="switchDataTab(event, 'users')">Users</button>
                    <button class="tab-btn" onclick="switchDataTab(event, 'drivers')">Drivers</button>
                    <button class="tab-btn" onclick="switchDataTab(event, 'agencies')">Agencies</button>
                </div>
                <button class="btn" onclick="openAddModal()">+ Add New</button>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email / Phone</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body">
                        <!-- Data loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Add/Edit -->
<div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modal-title" style="margin-top: 0;">Add New</h3>
        <input type="text" id="edit-name" placeholder="Full Name">
        <input type="text" id="edit-email" placeholder="Email / Phone">
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn" style="background: #333; color: #fff;" onclick="closeModal()">Cancel</button>
            <button class="btn" onclick="saveData()">Save</button>
        </div>
    </div>
</div>

<script>
    let currentDataTab = 'users';
    let currentEditId = null;

    async function fetchData(tab) {
        try {
            const res = await fetch(`/api/admin/manage/${tab}`);
            if (!res.ok) throw new Error('Network response was not ok');
            const data = await res.json();
            renderTable(data);
        } catch(e) {
            console.error('Fetch error:', e);
            document.getElementById('data-table-body').innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: #ef4444;">Failed to load data. Check backend API.</td></tr>';
        }
    }

    function switchDataTab(e, tab) {
        currentDataTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(e && e.target) e.target.classList.add('active');
        fetchData(tab);
    }

    function renderTable(data) {
        const tbody = document.getElementById('data-table-body');
        if(!tbody) return;
        
        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: #999;">No records found.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(item => `
            <tr>
                <td>#${item.id}</td>
                <td style="font-weight: bold;">${item.name}</td>
                <td style="color: #999;">${item.email || item.phone || '-'}</td>
                <td>
                    <span class="status-badge ${item.status === 'Approved' || item.status === 'Active' ? 'status-active' : 'status-pending'}">
                        ${item.status}
                    </span>
                </td>
                <td class="actions">
                    ${currentDataTab === 'drivers' && item.status !== 'Approved' ? `<button class="btn btn-approve" onclick="approveItem(${item.id})">Approve</button>` : ''}
                    <button class="btn btn-delete" onclick="deleteItem(${item.id})">Del</button>
                </td>
            </tr>
        `).join('');
    }

    function openAddModal() {
        currentEditId = null;
        document.getElementById('modal-title').innerText = 'Add New ' + currentDataTab.slice(0, -1);
        document.getElementById('edit-name').value = '';
        document.getElementById('edit-email').value = '';
        document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    async function saveData() {
        const name = document.getElementById('edit-name').value;
        const email = document.getElementById('edit-email').value;
        if (!name || !email) return alert('Please fill all fields');

        try {
            const res = await fetch(`/api/admin/manage/${currentDataTab}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, phone: email })
            });
            if(!res.ok) throw new Error('Save failed');
            closeModal();
            fetchData(currentDataTab);
        } catch(e) { alert('Failed to save data'); }
    }

    async function deleteItem(id) {
        if (confirm('Are you sure you want to delete this?')) {
            try {
                await fetch(`/api/admin/manage/${currentDataTab}/${id}`, { method: 'DELETE' });
                fetchData(currentDataTab);
            } catch(e) { alert('Failed to delete'); }
        }
    }

    async function approveItem(id) {
        try {
            await fetch(`/api/admin/manage/drivers/${id}/approve`, { method: 'PUT' });
            fetchData('drivers');
        } catch(e) { alert('Failed to approve'); }
    }

    async function loadWalletSettings() {
        try {
            const res = await fetch('/api/wallet/settings');
            if(res.ok) {
                const data = await res.json();
                const toggle = document.getElementById('wallet-toggle-input');
                if(toggle) toggle.checked = data.wallet_enabled;
            }
        } catch(e) {}
    }

    async function toggleWallet(el) {
        try {
            await fetch('/api/wallet/toggle', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: el.checked })
            });
        } catch(e) { alert('Server error'); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadWalletSettings();
        fetchData('users');
    });
</script>
</body>
</html>
