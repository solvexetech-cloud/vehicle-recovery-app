<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Vehicle Recovery</title>
  <link rel="stylesheet" href="style.css">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#84cc16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recovery" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
</head>
<body>

  <header>
    <div class="container">
      <div class="brand" data-i18n="app.title">Vehicle Recovery</div>
      <nav>
        <button id="lang-toggle">العربية</button>
        <button id="theme-toggle">🌙</button>
      </nav>
    </div>
  </header>

  <main class="login-container">
    <div class="card">
      <h2 class="brand" style="text-align: center; margin-bottom: 20px;">Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Email or Phone</label>
          <input type="text" id="login-email" placeholder="demo1@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="margin-top: 16px;" id="login-btn">Login</button>
        <p style="text-align: center; margin-top: 16px; font-size: 0.85em; color: var(--muted);">
          New here? <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create account</a>
        </p>
      </form>
    </div>
  </main>

  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const loginBtn = document.getElementById('login-btn');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        loginBtn.textContent = 'Logging in...';
        loginBtn.disabled = true;

        try {
          // പേലോഡിൽ 'identifier' എന്ന് മാറ്റി. കൂടാതെ credentials: 'include' ചേർത്തു (cookie-കൾക്കായി)
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: email, password: password }),
            credentials: 'include' 
          });

          const data = await response.json();

          if (response.ok) {
            // റോൾ കണ്ടെത്തുന്നു (ബാക്ക്എൻഡ് എങ്ങനെ റിട്ടേൺ ചെയ്യുന്നു എന്നത് അനുസരിച്ച്)
            let role = 'customer';
            if (data.user && data.user.role) role = data.user.role;
            else if (data.role) role = data.role;

            // ലോക്കൽ സ്റ്റോറേജിൽ സേവ് ചെയ്യുന്നു
            if(data.token) localStorage.setItem('token', data.token);
            localStorage.setItem('userRole', role);

            // റോൾ അനുസരിച്ച് റീഡയറക്ട് ചെയ്യുന്നു
            if (role === 'driver') {
              window.location.href = '/driver.html';
            } else if (role === 'agency') {
              window.location.href = '/agency.html';
            } else if (role === 'admin' || role === 'superadmin' || role === 'super_admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/customer.html';
            }
          } else {
            alert(data.message || 'Login failed. Please check your credentials.');
            loginBtn.textContent = 'Login';
            loginBtn.disabled = false;
          }
        } catch (error) {
          console.error('Login Error:', error);
          alert('Server error. Please try again later.');
          loginBtn.textContent = 'Login';
          loginBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
